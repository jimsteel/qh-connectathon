<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Launching</title>
<script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.3/build/fhir-client.min.js"></script></head>
<body>
<p>Launching…</p>
<script>
  // Register this app in Meld with launch URI .../launch.html and redirect URI .../ (this folder, trailing slash)
  const CLIENT_ID = '93e1eff0-233f-4d55-9c28-eb8f9fa60067';
  FHIR.oauth2.authorize({
    clientId: CLIENT_ID,
    // A population view: user-level read access (SMART v1 scopes; Meld supports no v2 scopes)
    // 'launch' only for an EHR launch (with a launch parameter)
    scope: (new URLSearchParams(location.search).has('launch') ? 'launch ' : '') + 'openid fhirUser online_access user/*.read',
    redirectUri: './'
  });
</script>
</body>
</html>
