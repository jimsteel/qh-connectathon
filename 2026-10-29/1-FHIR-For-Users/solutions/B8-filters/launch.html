<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Launching…</title>
<script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.3/build/fhir-client.min.js"></script></head>
<body>
<p>Launching…</p>
<script>
  // Register in Meld with launch URI .../launch.html and redirect URI .../ (this folder, trailing slash).
  const CLIENT_ID = 'f14b6c8a-7311-4c10-8778-8fbc2aa4764b';
  FHIR.oauth2.authorize({
    clientId: CLIENT_ID,
    // Population view: user-level read (SMART v1 scopes for Meld). 'launch' only for an EHR launch.
    scope: (new URLSearchParams(location.search).has('launch') ? 'launch ' : '') + 'openid fhirUser online_access user/*.read',
    redirectUri: './'
  });
</script>
</body>
</html>
